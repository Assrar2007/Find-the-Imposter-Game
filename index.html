<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07040f">
<title>Find the Imposter</title>
<style>
  :root{
    --bg:#07040f; --panel:rgba(20,13,44,.78); --panel2:#1d1447; --line:#3b2a78;
    --text:#f4f0ff; --dim:#a79dd6;
    --accent:#ff2e97; --accent2:#00e5ff; --cy:#00e5ff; --mg:#ff2e97; --lime:#b6ff3b; --yel:#ffd23f;
    --danger:#ff3d6e; --warn:#ffd23f; --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{background:var(--bg);overflow-x:hidden}
  body{
    background:
      radial-gradient(900px 480px at 50% -8%, rgba(124,58,237,.35) 0%, transparent 60%),
      linear-gradient(180deg,#0b0620 0%, var(--bg) 70%);
    color:var(--text);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  /* Animated starfield + synthwave grid floor (purely decorative) */
  #stars,#fx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none}
  #stars{z-index:0}
  #fx{z-index:60}
  body::before{
    content:"";position:fixed;left:0;right:0;bottom:0;height:46vh;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(0,229,255,.28) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,46,151,.28) 1px,transparent 1px);
    background-size:56px 56px;
    transform:perspective(420px) rotateX(58deg);transform-origin:50% 100%;
    -webkit-mask-image:linear-gradient(transparent,#000 75%);mask-image:linear-gradient(transparent,#000 75%);
    opacity:.8;
  }

  header,#hud,main,footer{position:relative;z-index:2}
  header{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:14px 16px 6px;max-width:560px;margin:0 auto;
  }
  header .brand{
    font-weight:900;letter-spacing:1.6px;font-size:14px;text-transform:uppercase;
    color:#e9e3ff;text-shadow:0 0 10px rgba(255,46,151,.7);
    display:flex;align-items:center;gap:8px;min-width:0;
  }
  header .brand .logo{filter:drop-shadow(0 0 6px rgba(0,229,255,.9))}
  .htools{display:flex;align-items:center;gap:6px}

  /* HUD: phase tracker + progress dots */
  #hud{max-width:560px;margin:4px auto 0;padding:0 16px}
  #hud:empty{display:none}
  .hud{
    list-style:none;margin:0;padding:8px 10px;display:flex;justify-content:space-between;gap:4px;
    background:rgba(20,13,44,.75);border:1px solid var(--line);border-radius:999px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .hud li{
    flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;
    font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);
  }
  .hud li i{
    width:10px;height:10px;border-radius:50%;background:#2a2060;box-shadow:inset 0 0 0 1px var(--line);
    transition:transform .25s,box-shadow .25s,background .25s;
  }
  .hud li.done{color:var(--cy)}
  .hud li.done i{background:var(--cy);box-shadow:0 0 8px rgba(0,229,255,.8)}
  .hud li.on{color:#fff}
  .hud li.on i{background:var(--mg);box-shadow:0 0 14px var(--mg),0 0 2px #fff;transform:scale(1.3)}

  main{max-width:560px;margin:0 auto;padding:8px 16px 40px;min-width:0}
  h1{
    font-size:46px;line-height:.98;margin:14px 0 10px;font-weight:900;
    text-transform:uppercase;letter-spacing:1px;color:#fff;
    text-shadow:0 0 14px rgba(255,46,151,.75),0 0 38px rgba(255,46,151,.4);
  }
  h1 .neon{color:var(--cy);text-shadow:0 0 14px rgba(0,229,255,.9),0 0 40px rgba(0,229,255,.45)}
  h2{font-size:24px;line-height:1.2;margin:10px 0 8px;overflow-wrap:anywhere;text-shadow:0 0 12px rgba(0,229,255,.25)}
  p{margin:8px 0;overflow-wrap:anywhere}
  .dim{color:var(--dim)}
  .lede{font-size:16px;color:#d9d3f5}
  .eyebrow{color:var(--cy);font-weight:800;font-size:12px;letter-spacing:2px;text-transform:uppercase;margin:14px 0 2px;text-shadow:0 0 8px rgba(0,229,255,.55)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:0 0 24px rgba(124,58,237,.15) inset}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  button{
    appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);
    font:inherit;font-weight:800;border-radius:12px;padding:13px 18px;cursor:pointer;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    transition:transform .08s,box-shadow .2s,background .2s;
  }
  button:hover{box-shadow:0 0 14px rgba(0,229,255,.25)}
  button:active{transform:translateY(1px) scale(.99)}
  button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
  button.primary{
    background:linear-gradient(135deg,#ff2e97,#7c3aed 70%,#5b2de0);border-color:transparent;color:#fff;
    text-shadow:0 1px 8px rgba(0,0,0,.35);
    box-shadow:0 0 18px rgba(255,46,151,.55),0 0 42px rgba(124,58,237,.35);
  }
  button.primary:hover{box-shadow:0 0 24px rgba(255,46,151,.85),0 0 56px rgba(124,58,237,.5)}
  button.ghost{background:transparent}
  button.icon{padding:9px 13px;font-size:14px}
  button.wide{display:block;width:100%}
  button[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{flex:1 1 auto;min-width:64px}
  .seg button.on{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 0 16px rgba(255,46,151,.6)}
  .stepper{display:flex;align-items:center;gap:14px}
  .stepper .num{font-size:32px;font-weight:900;min-width:2ch;text-align:center;color:var(--yel);text-shadow:0 0 12px rgba(255,210,63,.6)}
  input[type=text]{
    width:100%;font:inherit;color:var(--text);background:#0c0820;border:1px solid var(--line);
    border-radius:10px;padding:11px 12px;margin:4px 0;transition:box-shadow .2s,border-color .2s;
  }
  input[type=text]:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px rgba(0,229,255,.2)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:12px 0}
  .grid button{width:100%;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px;justify-content:flex-start;min-width:0}
  .grid button.on{background:var(--danger);border-color:transparent;color:#fff;box-shadow:0 0 18px rgba(255,61,110,.6)}
  .guessgrid button{justify-content:center}
  .guessgrid button.on{background:var(--yel);color:#20160a;border-color:transparent;box-shadow:0 0 18px rgba(255,210,63,.6)}

  /* Avatars */
  .av{
    display:inline-grid;place-items:center;flex:none;width:36px;height:36px;border-radius:50%;
    background:radial-gradient(circle at 30% 25%,hsl(var(--h) 100% 78%),hsl(var(--h) 90% 45%));
    color:#12061f;font-weight:900;font-size:16px;line-height:1;
    box-shadow:0 0 0 2px rgba(255,255,255,.08),0 0 14px hsla(var(--h),100%,60%,.45);
  }
  .av.sm{width:26px;height:26px;font-size:12px}
  .av.xl{width:68px;height:68px;font-size:30px;margin:6px 0 10px;box-shadow:0 0 0 3px rgba(255,255,255,.1),0 0 26px hsla(var(--h),100%,60%,.6)}
  .prow{display:flex;align-items:center;gap:10px}
  .prow input{margin:4px 0}

  /* Glowing hold-to-reveal card */
  .role-card{
    background:radial-gradient(circle at 50% 0%,rgba(255,46,151,.28),transparent 62%),linear-gradient(160deg,#241657,#0c0820);
    border:2px dashed var(--mg);border-radius:22px;
    min-height:230px;display:flex;align-items:center;justify-content:center;text-align:center;
    padding:22px;margin:16px 0;cursor:pointer;user-select:none;-webkit-user-select:none;
    box-shadow:0 0 28px rgba(255,46,151,.3),inset 0 0 44px rgba(124,58,237,.3);
    animation:pulse 2.6s ease-in-out infinite;
    transition:box-shadow .25s,border-color .25s;
  }
  .role-card.open{
    border-style:solid;border-color:var(--cy);animation:none;
    background:radial-gradient(circle at 50% 0%,rgba(0,229,255,.25),transparent 62%),linear-gradient(160deg,#10284a,#0a0f26);
    box-shadow:0 0 36px rgba(0,229,255,.55),inset 0 0 50px rgba(0,229,255,.14);
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 22px rgba(255,46,151,.25),inset 0 0 40px rgba(124,58,237,.25)}
    50%{box-shadow:0 0 44px rgba(255,46,151,.5),inset 0 0 56px rgba(124,58,237,.4)}
  }
  .reveal-panel{font-size:20px;font-weight:700;max-width:100%;overflow-wrap:anywhere}
  .reveal-panel .big{font-size:28px;display:block;margin:6px 0;text-shadow:0 0 12px rgba(255,255,255,.35)}
  .reveal-panel .word{color:var(--cy);font-size:34px;display:block;margin:10px 0 2px;letter-spacing:1px;text-transform:uppercase;text-shadow:0 0 16px rgba(0,229,255,.9)}
  .reveal-panel .imp{color:var(--mg);text-shadow:0 0 16px rgba(255,46,151,.9)}
  .reveal-panel .tiny{font-size:13px;color:var(--dim);font-weight:600;display:block;margin-top:12px}

  /* Conic countdown ring */
  .ring{
    --p:1;--cy:#00e5ff;
    position:relative;width:210px;height:210px;margin:14px auto;border-radius:50%;
    background:radial-gradient(circle,rgba(0,229,255,.16),transparent 68%);
  }
  .ring::before{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(var(--cy) calc(var(--p)*360deg),rgba(255,255,255,.08) 0);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 14px),#000 calc(100% - 13px));
            mask:radial-gradient(farthest-side,transparent calc(100% - 14px),#000 calc(100% - 13px));
    filter:drop-shadow(0 0 6px rgba(0,229,255,.7));
  }
  .ring.hot{--cy:var(--mg)}
  .ring.hot::before{filter:drop-shadow(0 0 8px rgba(255,46,151,.9))}
  .clock{font-size:46px;font-weight:900;font-variant-numeric:tabular-nums;text-align:center;margin:8px 0;text-shadow:0 0 16px rgba(0,229,255,.6)}
  .ring .clock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;margin:0}
  .clock.paused{color:var(--yel);text-shadow:0 0 16px rgba(255,210,63,.6)}
  .ring.hot .clock{color:var(--mg);text-shadow:0 0 16px rgba(255,46,151,.8)}
  .pill{display:inline-block;background:#120a2b;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--dim);margin:2px 6px 2px 0}

  /* Ranked scoreboard */
  .board{list-style:none;padding:0;margin:12px 0}
  .board li{
    display:flex;align-items:center;gap:10px;padding:10px 12px;margin:8px 0;border-radius:14px;
    background:rgba(255,255,255,.03);border:1px solid var(--line);
  }
  .board li.lead{border-color:var(--yel);box-shadow:0 0 22px rgba(255,210,63,.28);background:rgba(255,210,63,.06)}
  .board .pos{width:38px;text-align:center;font-weight:900;font-size:18px;flex:none}
  .board .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
  .board .pts{font-weight:900;font-size:24px;font-variant-numeric:tabular-nums;color:var(--yel);text-shadow:0 0 10px rgba(255,210,63,.5)}

  .truth{font-size:18px;text-align:center}
  .truth strong{color:var(--cy);text-transform:uppercase;letter-spacing:1px;text-shadow:0 0 12px rgba(0,229,255,.7)}
  .feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0 6px}
  .feat{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;
    box-shadow:0 0 18px rgba(0,229,255,.08);
  }
  .feat .ico{font-size:24px;display:block;filter:drop-shadow(0 0 8px rgba(255,46,151,.6))}
  .feat b{display:block;margin:6px 0 2px;font-size:15px}
  .feat small{color:var(--dim);font-size:13px;line-height:1.35;display:block}
  .hero-btn{font-size:18px;padding:18px;margin-top:14px;letter-spacing:1px;text-transform:uppercase}

  .banner{border-radius:var(--radius);padding:18px 16px;margin:14px 0;font-weight:900;font-size:21px;text-align:center;text-shadow:0 0 10px currentColor}
  .banner.good{background:rgba(182,255,59,.1);border:1px solid var(--lime);color:var(--lime);box-shadow:0 0 26px rgba(182,255,59,.22)}
  .banner.bad{background:rgba(255,61,110,.1);border:1px solid var(--danger);color:var(--danger);box-shadow:0 0 26px rgba(255,61,110,.25)}
  .banner.tie{background:rgba(255,210,63,.1);border:1px solid var(--warn);color:var(--warn);box-shadow:0 0 26px rgba(255,210,63,.22)}
  .overlay{
    position:fixed;inset:0;background:rgba(5,2,14,.75);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:400px;width:100%;box-shadow:0 0 40px rgba(255,46,151,.25)}
  .modal h2{margin-top:0}
  .modal .row{margin-top:16px}
  footer{max-width:560px;margin:0 auto;padding:0 16px 30px;color:#6c64a0;font-size:12px;text-align:center}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<header>
  <span class="brand"><span class="logo" aria-hidden="true">🕵️</span> Find the Imposter</span>
  <span class="htools"><button id="muteBtn" class="icon ghost" data-action="mute" aria-label="Toggle sound">🔊</button><span id="headerQuit"></span></span>
</header>
<div id="hud" aria-hidden="true"></div>
<main id="app" aria-live="polite"></main>
<footer>Pass one phone around. Every round hides a new word.</footer>

<script>
'use strict';
/* ------------------------------------------------------------------ */
/* Word pool                                                           */
/* ------------------------------------------------------------------ */
const WORDS=[
  'pizza','elephant','guitar','rocket','beach','castle','dragon','coffee',
  'jungle','mirror','pencil','volcano','penguin','rainbow','submarine','treasure',
  'umbrella','wizard','bicycle','candle','dolphin','fireworks','glacier','hammock',
  'kangaroo','lighthouse','mushroom','orchestra','pyramid','skeleton','telescope','violin'
];
const MIN_PLAYERS=4, MAX_PLAYERS=12;
const GUESS_OPTIONS=6;
const GUARD_MS=450;               /* anti double-tap window            */
const GUARDED=new Set(['openReveal','nextReveal','openBallot','confirmVote','openGuess','confirmGuess']);

/* ------------------------------------------------------------------ */
/* Global state (intentionally global: simple for a party game and     */
/* handy for tests)                                                    */
/* ------------------------------------------------------------------ */
function makePlayers(n){ return Array.from({length:n},(_,i)=>({id:'p'+(i+1),name:'Player '+(i+1)})); }

let state={
  screen:'home',
  setup:{ players:makePlayers(MIN_PLAYERS), imposterCount:1, timerSeconds:60 },
  scores:{},
  round:null,
  lastWord:null,
  clock:null
};
let clickGuard=0;      /* timestamp until which guarded taps are swallowed */
let stickyReveal=false;/* "pinned" reveal toggled by tap / Enter           */
let clockTimer=null;

/* ------------------------------------------------------------------ */
/* Small helpers                                                       */
/* ------------------------------------------------------------------ */
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function rand(n){ return Math.floor(Math.random()*n); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rand(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function nameOf(id){ const p=state.setup.players.find(p=>p.id===id); return p?p.name:id; }
function pickWord(){
  const pool=WORDS.filter(w=>w!==state.lastWord);
  return pool[rand(pool.length)];
}

/* ------------------------------------------------------------------ */
/* Game flow                                                           */
/* ------------------------------------------------------------------ */
function startGame(){
  const players=state.setup.players;
  const ids=players.map(p=>p.id);
  const imposterCount=Math.max(1,Math.min(state.setup.imposterCount,ids.length-1));
  const imposters=shuffle(ids).slice(0,imposterCount);
  const word=pickWord();
  state.scores={}; ids.forEach(id=>state.scores[id]=0);
  state.round={
    word, imposters,
    alive:ids.slice(),
    revealIndex:0, revealOpen:false, revealed:false,
    clueIndex:0,
    ballot:null, runoff:false, deadlock:false,
    eliminated:null, elimWasImposter:false,
    guessChoices:null, guessIndex:null, guessOpen:false,
    result:null
  };
  state.lastWord=word;
  stickyReveal=false;
  stopClock();
  state.screen='reveal';
  paint();
}

function openReveal(){ state.round.revealOpen=true; state.round.revealed=false; stickyReveal=false; paint(); }

function nextReveal(){
  const r=state.round;
  r.revealIndex++; r.revealOpen=false; r.revealed=false; stickyReveal=false;
  paint();
}

function beginClues(){ state.round.clueIndex=0; state.screen='clues'; paint(); }

function nextSpeaker(){
  const r=state.round;
  r.clueIndex++;
  if(r.clueIndex>=r.alive.length){ beginDiscussion(); return; }
  paint();
}

function beginDiscussion(){
  stopClock();
  state.screen='discussion';
  const secs=state.setup.timerSeconds|0;
  if(secs>0){
    state.clock={ total:secs*1000, remaining:secs*1000, deadline:Date.now()+secs*1000, running:true };
    clockTimer=setInterval(paintClock,250);
  }else{
    state.clock=null;
  }
  paint();
}

function stopClock(){ if(clockTimer!==null){ clearInterval(clockTimer); clockTimer=null; } }

function paintClock(){
  const c=state.clock;
  if(!c) return;
  if(c.running && Date.now()>=c.deadline){ stopClock(); beginBallot(); return; }
  const el=document.querySelector('.clock');
  if(el){
    const ms=c.running?Math.max(0,c.deadline-Date.now()):c.remaining;
    const s=Math.ceil(ms/1000);
    el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    el.classList.toggle('paused',!c.running);
    const ring=document.querySelector('.ring');
    if(ring){
      ring.style.setProperty('--p',Math.max(0,Math.min(1,ms/c.total)).toFixed(4));
      ring.classList.toggle('hot',c.running&&s<=10);
    }
  }
}

function toggleClock(){
  const c=state.clock;
  if(!c) return;
  if(c.running){ c.remaining=Math.max(0,c.deadline-Date.now()); c.running=false; }
  else{ c.deadline=Date.now()+c.remaining; c.running=true; }
  paint();
}

function beginBallot(){
  stopClock();
  const r=state.round;
  r.ballot={ voters:r.alive.slice(), index:0, candidates:r.alive.slice(), votes:{}, pick:null, open:false };
  state.screen='voting';
  paint();
}

function openBallot(){
  const b=state.round.ballot;
  b.open=true; b.pick=null;
  paint();
}

function selectVote(id){ state.round.ballot.pick=id; paint(); }

function confirmVote(){
  const b=state.round.ballot;
  if(!b || b.pick===null) return;
  const voter=b.voters[b.index];
  b.votes[voter]=b.pick;
  b.index++;
  b.pick=null;
  if(b.index>=b.voters.length){ resolveBallot(); return; }
  b.open=false;
  paint();
}

function resolveBallot(){
  const r=state.round;
  const counts={};
  Object.values(r.ballot.votes).forEach(v=>counts[v]=(counts[v]||0)+1);
  const max=Math.max.apply(null,Object.values(counts));
  const top=Object.keys(counts).filter(k=>counts[k]===max);
  if(top.length>1){
    if(r.runoff){ endImposterWin('deadlock'); return; }
    r.deadlock=true; r.runoff=true; r.tied=top.slice();
    state.screen='tally'; paint(); return;
  }
  r.deadlock=false;
  const eliminated=top[0];
  r.alive=r.alive.filter(x=>x!==eliminated);
  r.eliminated=eliminated;
  r.elimWasImposter=r.imposters.includes(eliminated);
  r.runoff=false;
  state.screen='tally';
  paint();
}

function beginGuess(){
  const r=state.round;
  const others=shuffle(WORDS.filter(w=>w!==r.word)).slice(0,GUESS_OPTIONS-1);
  r.guessChoices=shuffle([r.word].concat(others));
  r.guessIndex=null; r.guessOpen=false;
  state.screen='guess';
  paint();
}

function openGuess(){ state.round.guessOpen=true; paint(); }
function selectGuess(i){ state.round.guessIndex=Number(i); paint(); }

function confirmGuess(){
  const r=state.round;
  if(r.guessIndex===null || r.guessIndex===undefined) return;
  const choice=r.guessChoices[r.guessIndex];
  r.guessResult=choice;
  if(choice===r.word){
    r.imposters.forEach(id=>state.scores[id]+=2);
    r.result={winner:'imposters',reason:'guess'};
  }else{
    r.alive.filter(id=>!r.imposters.includes(id)).forEach(id=>state.scores[id]+=1);
    r.result={winner:'crew',reason:'capture'};
  }
  state.screen='result';
  paint();
}

function continueTally(){
  const r=state.round;
  if(r.deadlock){ beginBallot(); return; }            /* runoff vote   */
  if(r.elimWasImposter){
    const left=r.imposters.filter(id=>r.alive.includes(id));
    if(left.length>0){ endImposterWin('survivor'); return; }
    beginGuess(); return;                              /* last imposter caught */
  }
  const impsAlive=r.imposters.filter(id=>r.alive.includes(id)).length;
  if(impsAlive>0 && r.alive.length-impsAlive<=impsAlive){ endImposterWin('survivor'); return; }
  beginBallot();
}

function endImposterWin(reason){
  const r=state.round;
  r.imposters.forEach(id=>state.scores[id]+=3);
  r.result={winner:'imposters',reason};
  state.screen='result';
  paint();
}

/* WebAudio synth SFX. Lazily created on first user gesture; fails silently. */
const SFX=(()=>{
  let ctx=null, muted=false;
  try{ muted=localStorage.getItem('fti-mute')==='1'; }catch(e){}
  function audio(){
    try{
      if(!ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; ctx=new C(); }
      if(ctx.state==='suspended') ctx.resume().catch(()=>{});
      return ctx;
    }catch(e){ return null; }
  }
  function tone(freq,dur,type,vol,when,slide){
    if(muted) return;
    const a=audio(); if(!a) return;
    try{
      const t=a.currentTime+(when||0);
      const o=a.createOscillator(), g=a.createGain();
      o.type=type||'square';
      o.frequency.setValueAtTime(freq,t);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);
      g.gain.setValueAtTime(vol||0.05,t);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t+dur+0.03);
    }catch(e){}
  }
  const bank={
    tap:    ()=>tone(880,0.05,'square',0.025),
    reveal: ()=>tone(330,0.28,'sawtooth',0.035,0,620),
    vote:   ()=>{ tone(660,0.08,'square',0.03); tone(990,0.1,'square',0.03,0.07); },
    good:   ()=>[523,659,784].forEach((f,i)=>tone(f,0.2,'triangle',0.06,i*0.09)),
    bad:    ()=>tone(240,0.45,'sawtooth',0.05,0,-170),
    win:    ()=>[523,659,784,1046].forEach((f,i)=>tone(f,0.22,'triangle',0.07,i*0.1))
  };
  return {
    play(name){ if(!muted && bank[name]) bank[name](); },
    toggle(){ muted=!muted; try{ localStorage.setItem('fti-mute',muted?'1':'0'); }catch(e){} return muted; },
    isMuted(){ return muted; }
  };
})();

/* Confetti burst on a fixed canvas. */
const FX=(()=>{
  const c=document.getElementById('fx');
  const x=c.getContext('2d');
  const colors=['#ff2e97','#00e5ff','#b6ff3b','#ffd23f','#7c6cff'];
  let parts=[], raf=0;
  function size(){
    c.width=innerWidth*devicePixelRatio; c.height=innerHeight*devicePixelRatio;
    x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  addEventListener('resize',size); size();
  function tick(){
    x.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(p=>p.y<innerHeight+20 && p.life++<420);
    for(const p of parts){
      p.vy+=p.g; p.vx*=0.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r);
      x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      x.restore();
    }
    raf=parts.length?requestAnimationFrame(tick):0;
  }
  function burst(n){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for(let i=0;i<(n||150);i++){
      parts.push({
        x:innerWidth/2+(Math.random()-0.5)*140, y:innerHeight*0.32,
        vx:(Math.random()-0.5)*12, vy:-Math.random()*13-4, g:0.27,
        s:Math.random()*7+4, r:Math.random()*6, vr:(Math.random()-0.5)*0.3,
        c:colors[i%colors.length], life:0
      });
    }
    if(!raf) raf=requestAnimationFrame(tick);
  }
  return { burst };
})();

/* Twinkling starfield behind everything. */
(function starfield(){
  const c=document.getElementById('stars');
  const x=c.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let stars=[], w=0, h=0;
  function init(){
    w=c.width=innerWidth; h=c.height=innerHeight;
    stars=Array.from({length:Math.min(260,Math.round(w*h/7000))},()=>({
      x:Math.random()*w, y:Math.random()*h, z:Math.random()*0.9+0.1, tw:Math.random()*6.28
    }));
  }
  function frame(t){
    x.clearRect(0,0,w,h);
    for(const s of stars){
      if(!reduce){ s.y+=s.z*0.4; if(s.y>h){ s.y=0; s.x=Math.random()*w; } }
      const a=0.35+s.z*0.55+0.2*Math.sin(t/900+s.tw);
      x.fillStyle='rgba(200,230,255,'+Math.max(0.1,Math.min(1,a)).toFixed(3)+')';
      x.fillRect(s.x,s.y,s.z*2,s.z*2);
    }
    if(!reduce) requestAnimationFrame(frame);
  }
  addEventListener('resize',init);
  init(); requestAnimationFrame(frame);
})();

        '<button data-action="timerSeconds" data-value="120"'+(s.timerSeconds===120?' class="on"':'')+'>120s</button>'+
      '</div></div>'+
    '<button class="primary wide" data-action="start"'+(canStart?'':' disabled')+'>Start game</button>';
}

function paint(){
  const app=document.getElementById('app');
  const quitSlot=document.getElementById('headerQuit');
  const inGame=['reveal','clues','discussion','voting','tally','guess','result','scoreboard'].includes(state.screen);
  quitSlot.innerHTML=inGame?'<button class="icon ghost" data-action="quit" aria-label="Quit game">✕ Quit</button>':'';
  let html='';
  switch(state.screen){
    case 'setup':      html=setupScreenHTML(); break;
    case 'reveal':     html=revealScreenHTML(); break;
    case 'clues':      html=cluesScreenHTML(); break;
    case 'discussion': html=discussionScreenHTML(); break;
    case 'voting':     html=votingScreenHTML(); break;
    case 'tally':      html=tallyScreenHTML(); break;
    case 'guess':      html=guessScreenHTML(); break;
    case 'result':     html=resultScreenHTML(); break;
    case 'scoreboard': html=scoreboardScreenHTML(); break;
    default:           html=homeScreenHTML();
  }
  app.innerHTML=html;
  document.getElementById('hud').innerHTML=hudHTML();
  document.getElementById('muteBtn').textContent=SFX.isMuted()?'🔇':'🔊';
  if(state.screen!==prevScreen){ prevScreen=state.screen; onScreenEnter(state.screen); }
}

/* ------------------------------------------------------------------ */
/* Event wiring (delegated, survives re-renders)                       */
/* ------------------------------------------------------------------ */
const ACTIONS={
  play, increasePlayers, decreasePlayers,
  imposterCount:el=>setImposterCount(Number(el.dataset.value)),
  timerSeconds:el=>setTimerSeconds(Number(el.dataset.value)),
  start:startGame,
  openReveal, tapReveal:toggleRevealSticky, nextReveal,
  beginClues, nextSpeaker,
  toggleClock, goVote:beginBallot,
  openBallot, selectVote:el=>selectVote(el.dataset.value), confirmVote,
  continueTally,
  openGuess, selectGuess:el=>selectGuess(el.dataset.index), confirmGuess,
  scoreboard:showScoreboard, nextRound, goHome,
  quit, quitCancel, quitConfirm,
  mute:toggleMute
};

document.addEventListener('click',e=>{
  const el=e.target.closest?e.target.closest('[data-action]'):null;
  if(!el) return;
  const action=el.dataset.action;
  if(GUARDED.has(action)){
    const now=Date.now();
    if(now<clickGuard) return;         /* swallow accidental double tap */
    clickGuard=now+GUARD_MS;
  }
  if(action!=='mute') SFX.play(action==='openReveal'?'reveal':'tap');
  const fn=ACTIONS[action];
  if(fn) fn(el);
});

document.addEventListener('pointerdown',e=>{
  if(e.target.closest&&e.target.closest('[data-hold="role"]')) showRole();
},true);

document.addEventListener('pointerup',()=>{
  if(state.round&&state.round.revealed&&!stickyReveal){
    state.round.revealed=false;
    paintRevealPanel();
  }
},true);

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeModal(); return; }
  if(e.key==='Enter'&&e.target&&e.target.closest&&e.target.closest('[data-hold="role"]')){
    e.preventDefault();
    toggleRevealSticky();
  }
});

document.addEventListener('input',e=>{
  const el=e.target;
  if(el&&el.dataset&&el.dataset.nameIndex!==undefined){
    const p=state.setup.players[Number(el.dataset.nameIndex)];
    if(p) p.name=el.value||p.id;
    const av=el.parentElement&&el.parentElement.querySelector('.av');
    if(av&&p) av.textContent=(String(p.name).charAt(0)||'?').toUpperCase();
  }
});

paint();
</script>
</body>
</html>
